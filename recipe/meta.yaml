{% set name = "pycares" %}
{% set version = "5.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5a3c249c830432631439815f9a818463416f2a8cbdb1e988e78757de9ae75081

build:
  number: 0
  skip: True  # [py<39]
  script_env:
    - PYCARES_USE_SYSTEM_LIB=1
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    - cffi >=1.5.0    # [py<314]
    - cffi >=2.0.0b1  # [py>=314]
    - setuptools
    - wheel
    - c-ares {{ c_ares }}
  run:
    - python
    - c-ares
    - cffi >=1.5.0    # [py<314]
    - cffi >=2.0.0b1  # [py>=314]
  run_constrained:
    - idna >=2.1

test:
  source_files:
    - tests
  imports:
    - pycares
    - pycares.errno
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - python -m pycares google.com
    - pytest -v -k "not (test_query_class_chaos or test_channel_nameservers)"

about:
  home: https://pypi.org/project/pycares
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python interface for c-ares
  description: |
    pycares is a Python module which provides an interface to c-ares. c-ares
    is a C library that performs DNS requests and name resolutions
    asynchronously.
  doc_url: https://pycares.readthedocs.io
  dev_url: https://github.com/saghul/pycares

extra:
  recipe-maintainers:
    - CurtLH